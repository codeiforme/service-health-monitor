services:
  target:
    build: .
    image: service-health-monitor:local
    command: ["python", "-m", "app.target"]
    ports:
      - "127.0.0.1:8000:8000"

  monitor:
    build: .
    image: service-health-monitor:local
    environment:
      TARGET_URL: http://target:8000/health
      CHECK_INTERVAL: "10"
      WEBHOOK_URL: ${WEBHOOK_URL:-}

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.0.0
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
